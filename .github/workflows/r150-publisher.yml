name: Publish R1.5.0 administrator tool
on:
  push:
    tags:
      - r1.5.0-publisher-v1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload standalone administrator package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload r1.5.0-download \
            downloads/R1.5.0/FiberRouteR1-Publisher-R1.5.0.zip \
            --clobber
