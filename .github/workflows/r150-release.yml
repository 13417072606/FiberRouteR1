name: Publish R1.5.0 download
on:
  push:
    tags:
      - r1.5.0-download-v2
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload r1.5.0-download \
            downloads/R1.5.0/FiberRouteR1-R1.5.0-install.zip \
            downloads/R1.5.0/FiberRouteR1-win-x64-R1.5.0.zip \
            --clobber
