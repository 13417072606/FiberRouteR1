name: Check R1.5.1 Windows download script

on:
  push:
    tags:
      - r1.5.1-download-script-v*

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned hashes against published assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/13417072606/FiberRouteR1/releases/tags/r1.5.1-download | ConvertFrom-Json
          $script = (Get-Content -LiteralPath 'scripts/Download-R151-Software.ps1' -Raw).ToUpperInvariant()
          foreach ($asset in $release.assets) {
            if ($asset.name.StartsWith('FiberRouteR1-R1.5.1-program-source.zip')) {
              $hash = $asset.digest.Substring(7).ToUpperInvariant()
              if (-not $script.Contains($hash)) { throw "Pinned hash missing or incorrect: $($asset.name)" }
            }
          }
      - name: Run in Windows PowerShell 5.1 and verify package
        shell: powershell
        run: |
          .\scripts\Download-R151-Software.ps1 -NoOpen
          $zip = Get-ChildItem -LiteralPath (Join-Path $env:USERPROFILE 'Downloads') -Filter 'FiberRouteR1-R1.5.1-program-source.zip' -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          if (-not $zip) { throw 'Final ZIP was not produced' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($hash -ne '1FFBD345C855C544E23BBDEC477FB0BCFAECBFBABA6722EA951C96950CAD8F92') { throw 'Final ZIP hash mismatch' }
      - name: Publish tested helper script
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload r1.5.1-download scripts/Download-R151-Software.ps1 --clobber
