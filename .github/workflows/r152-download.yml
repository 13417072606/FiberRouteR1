name: Publish R1.5.2 downloads

on:
  push:
    tags:
      - r1.5.2-download

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows application and updater
        run: |
          dotnet publish src/FiberRoute.App/FiberRoute.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/app-r152 -p:RestoreLockedMode=true -p:DebugType=None -p:DebugSymbols=false
          dotnet publish src/FiberRoute.Updater/FiberRoute.Updater.csproj -c Release -r win-x64 --self-contained false -o artifacts/updater-r152 -p:DebugType=None -p:DebugSymbols=false
          dotnet run --project tests/FiberRoute.Tests/FiberRoute.Tests.csproj -c Release -- --online-only
      - name: Fetch existing native launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/launcher-r152
          gh release download r1.5.1-download --pattern 'FiberRouteR1-R1.5.1-program-source.zip' --dir "$RUNNER_TEMP"
          python3 - "$RUNNER_TEMP/FiberRouteR1-R1.5.1-program-source.zip" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys
          with ZipFile(sys.argv[1]) as source:
              data=source.read('R1.5.1软件发布源/光路调度路由查询.exe')
          Path('artifacts/launcher-r152/光路调度路由查询.exe').write_bytes(data)
          PY
      - name: Build and validate delivery
        run: |
          python3 scripts/make-r152-delivery.py
          python3 -m zipfile -e downloads/R1.5.2/FiberRouteR1-R1.5.2-program-source.zip "$RUNNER_TEMP/r152-source"
          dotnet run --project src/FiberRoute.Admin/FiberRoute.Admin.csproj -c Release -- pack-program "$RUNNER_TEMP/r152-source/光路调度路由分析R1.5.2" 1.5.2 "$RUNNER_TEMP/r152-online.zip"
          dotnet run --project tests/FiberRoute.Tests/FiberRoute.Tests.csproj -c Release -- --validate-package "$RUNNER_TEMP/r152-online.zip"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            downloads/R1.5.2/FiberRouteR1-R1.5.2-program-source.zip \
            scripts/Make-R152-Configured-Client.ps1 \
            docs/R1.5.2-修正记录.md \
            --title "R1.5.2 界面与搜索优化" \
            --notes "程序发布源已验证可生成在线软件更新包。管理员在本机用 Make-R152-Configured-Client.ps1 将原 F 盘工作区的公开更新配置加入客户端包；签名私钥和业务数据库不在发布附件中。详见修正记录。"
