name: Publish R1.5.2 complete client
on:
  push:
    tags:
      - r1.5.2-full-v*
permissions:
  contents: write
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify complete client layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/r152"
          gh release download r1.5.2-download --pattern 'FiberRouteR1-R1.5.2-program-source.zip' --dir "$RUNNER_TEMP/r152"
          python3 scripts/make-r152-full.py "$RUNNER_TEMP/r152/FiberRouteR1-R1.5.2-program-source.zip" "$RUNNER_TEMP/r152/FiberRouteR1-R1.5.2-full-client.zip"
          python3 - "$RUNNER_TEMP/r152/FiberRouteR1-R1.5.2-full-client.zip" <<'PY'
          import sys,zipfile,json,hashlib
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist(); root='光路调度路由分析R1.5.2/'
              assert z.testzip() is None
              for name in ('光路调度路由查询.exe','程序/FiberRouteR1.dll','程序/FiberRoute.Updater.exe','资源/中继段导入模板.csv','资源/节点类型模板.csv','数据/','使用说明.txt','文件校验SHA256.json'):
                  assert root+name in names,name
              assert any(n.startswith(root+'第三方许可/') for n in names)
              assert not any(n.lower().endswith(('.db','.pem','.xlsx','.pdb')) for n in names)
              manifest=json.loads(z.read(root+'文件校验SHA256.json'))
              for name,digest in manifest.items():
                  assert hashlib.sha256(z.read(root+name)).hexdigest().upper()==digest,name
              print('Verified',len(names),'complete-client entries')
          PY
          gh release upload r1.5.2-download "$RUNNER_TEMP/r152/FiberRouteR1-R1.5.2-full-client.zip" scripts/Make-R152-Configured-Client.ps1 --clobber
